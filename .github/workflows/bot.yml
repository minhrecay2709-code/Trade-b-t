name: Trade Bot

on:
  schedule:
    - cron: '0,30 2-4 * * 1-5'
    - cron: '0,30 6-7 * * 1-5'
  workflow_dispatch:

jobs:
  quet-tin-hieu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
